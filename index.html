<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schema → ER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   Schema -> ER   ·   styles.css
   Light theme lives in :root. Dark theme overrides via
   html[data-theme="dark"]. The JS sets that attribute.
   ========================================================= */

:root{
  /* app chrome */
  --paper:#EDF0F2;
  --panel:#FFFFFF;
  --ink:#172231;
  --muted:#647084;
  --edge:#D7DCE1;
  --edge-strong:#B9C0C9;
  /* accents */
  --accent:#4E43E0;
  --accent-hover:#3D33C9;
  --key:#C77A0A;
  --mn:#1E9E8A;
  --err:#C6392E;
  /* code editor (dark in both themes by design) */
  --code-bg:#0F1720;
  --code-fg:#D8DEE9;
  --code-ph:#4B5A6D;
  /* misc */
  --canvas-square:#FBFBFC;
  --radius:10px;
}

html[data-theme="dark"]{
  --paper:#0E141B;
  --panel:#161E27;
  --ink:#E4E9EF;
  --muted:#8A97A8;
  --edge:#263441;
  --edge-strong:#38495A;
  --accent:#7B72FF;
  --accent-hover:#8E86FF;
  --key:#E0A43C;
  --mn:#34C0A8;
  --err:#F0776B;
  --code-bg:#0B1017;
  --code-fg:#D8DEE9;
  --code-ph:#3C4A5C;
  --canvas-square:#111922;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px; line-height:1.5;
  display:flex; flex-direction:column; min-height:100vh;
  transition:background-color .2s ease, color .2s ease;
}

/* ---- header / title block ---- */
header{
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:16px 22px; border-bottom:1px solid var(--edge); background:var(--panel);
  flex-wrap:wrap; transition:background-color .2s ease, border-color .2s ease;
}
.brand{display:flex; align-items:baseline; gap:12px}
.brand h1{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;
  letter-spacing:-.01em; margin:0;
}
.brand .sub{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.14em;
}
.header-right{display:flex; align-items:center; gap:22px}

/* signature: crow's-foot cardinality legend */
.legend{display:flex; gap:18px; align-items:center}
.legend .item{display:flex; align-items:center; gap:7px}
.legend .item span{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
  letter-spacing:.04em;
}
.legend svg{display:block}
.legend svg *{stroke:var(--muted)}

/* theme toggle */
.theme-toggle{
  display:inline-flex; align-items:center; justify-content:center;
  width:36px; height:36px; padding:0; border:1px solid var(--edge);
  border-radius:9px; background:var(--panel); color:var(--ink); cursor:pointer;
  transition:border-color .12s ease, background-color .2s ease;
}
.theme-toggle:hover{border-color:var(--edge-strong)}
.theme-toggle svg{width:17px; height:17px; display:block}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
html[data-theme="dark"] .theme-toggle .icon-sun{display:block}
html[data-theme="dark"] .theme-toggle .icon-moon{display:none}

main{
  flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:0; min-height:0;
}
.pane{display:flex; flex-direction:column; min-height:0; min-width:0}
.pane.input{border-right:1px solid var(--edge)}

.pane-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 16px; border-bottom:1px solid var(--edge); background:var(--panel);
  transition:background-color .2s ease, border-color .2s ease;
}
.pane-bar .title{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted);
}
.controls{display:flex; gap:8px; align-items:center}

select, button{
  font-family:'IBM Plex Mono',monospace; font-size:12px;
  border:1px solid var(--edge); border-radius:8px; padding:7px 11px;
  background:var(--panel); color:var(--ink); cursor:pointer;
  transition:border-color .12s ease, background-color .2s ease, color .2s ease;
}
select:hover, button:hover{border-color:var(--edge-strong)}
button.primary{
  background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;
}
button.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
button.ghost{background:transparent}
button:disabled{opacity:.5; cursor:default}

/* ---- SQL editor (dark in both themes) ---- */
.editor-wrap{flex:1; display:flex; min-height:0; background:var(--code-bg)}
textarea#sql{
  flex:1; resize:none; border:0; outline:0; padding:18px 20px;
  background:var(--code-bg); color:var(--code-fg);
  font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.65;
  tab-size:2; transition:background-color .2s ease;
}
textarea#sql::placeholder{color:var(--code-ph)}

/* ---- output ---- */
.out-scroll{
  flex:1; position:relative; overflow:hidden; min-height:0;
  cursor:grab; touch-action:none; user-select:none;
  background:
    linear-gradient(var(--edge) 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg,var(--edge) 1px,transparent 1px) 0 0/22px 22px,
    var(--panel);
  transition:background-color .2s ease;
}
.out-scroll.grabbing{cursor:grabbing}
.canvas{position:relative; width:100%; height:100%}
.canvas svg{position:absolute; top:0; left:0; max-width:none; transform-origin:0 0}
.placeholder{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  text-align:center; color:var(--muted);
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.03em;
}

/* zoom / pan controls */
.zoom-controls{
  position:absolute; right:14px; bottom:14px; z-index:5;
  display:flex; align-items:center; gap:4px; padding:5px;
  background:var(--panel); border:1px solid var(--edge); border-radius:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.14); cursor:default;
}
.zoom-controls button{
  width:30px; height:30px; padding:0; font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center; border-radius:7px;
}
.zoom-controls #zoomLabel{
  min-width:46px; text-align:center; font-family:'IBM Plex Mono',monospace;
  font-size:11px; color:var(--muted); user-select:none;
}
.zoom-controls[hidden]{display:none}

.src-panel{border-top:1px solid var(--edge); background:var(--panel); transition:background-color .2s ease}
.src-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 16px; cursor:pointer; user-select:none;
}
.src-head .title{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.src-body{display:none; border-top:1px solid var(--edge)}
.src-body.open{display:block}
pre#mermaidSrc{
  margin:0; padding:14px 18px; max-height:190px; overflow:auto;
  font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6;
  color:var(--ink); background:var(--canvas-square);
}

/* ---- status strip ---- */
.status{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:8px 16px; border-top:1px solid var(--edge); background:var(--panel);
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);
  transition:background-color .2s ease, border-color .2s ease;
}
.status b{color:var(--ink); font-weight:600}
.status .warn{color:var(--key)}
.status .err{color:var(--err)}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2px 8px;
  border:1px solid var(--edge); border-radius:20px;
}
.dot{width:7px;height:7px;border-radius:50%}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  .pane.input{border-right:0; border-bottom:1px solid var(--edge)}
  textarea#sql{min-height:240px}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <h1>Schema&nbsp;→&nbsp;ER</h1>
    <span class="sub">sql ddl · entity-relationship</span>
  </div>

  <div class="header-right">
    <div class="legend" aria-label="Cardinality key">
      <div class="item">
        <svg width="52" height="14" viewBox="0 0 52 14"><line x1="4" y1="7" x2="48" y2="7" stroke-width="1.4"/><line x1="10" y1="2" x2="10" y2="12" stroke-width="1.4"/><line x1="42" y1="2" x2="42" y2="12" stroke-width="1.4"/></svg>
        <span>1 : 1</span>
      </div>
      <div class="item">
        <svg width="52" height="14" viewBox="0 0 52 14"><line x1="4" y1="7" x2="42" y2="7" stroke-width="1.4"/><line x1="10" y1="2" x2="10" y2="12" stroke-width="1.4"/><path d="M42 7 L48 2 M42 7 L48 12 M42 7 L48 7" stroke-width="1.4" fill="none"/></svg>
        <span>1 : N</span>
      </div>
      <div class="item">
        <svg width="52" height="14" viewBox="0 0 52 14"><line x1="10" y1="7" x2="42" y2="7" stroke-width="1.4"/><path d="M10 7 L4 2 M10 7 L4 12 M10 7 L4 7 M42 7 L48 2 M42 7 L48 12 M42 7 L48 7" stroke-width="1.4" fill="none"/></svg>
        <span>M : N</span>
      </div>
    </div>

    <button id="themeToggle" class="theme-toggle" aria-label="Switch to dark mode" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="pane input">
    <div class="pane-bar">
      <span class="title">SQL script</span>
      <div class="controls">
        <select id="sample" title="Load a sample schema">
          <option value="grading">Sample · grading system</option>
          <option value="shop">Sample · e-commerce</option>
          <option value="blog">Sample · blog</option>
          <option value="blank">Blank</option>
        </select>
        <button id="run" class="primary">Generate diagram</button>
      </div>
    </div>
    <div class="editor-wrap">
      <textarea id="sql" spellcheck="false" placeholder="Paste CREATE TABLE / ALTER TABLE statements here…"></textarea>
    </div>
  </section>

  <section class="pane output">
    <div class="pane-bar">
      <span class="title">ER diagram</span>
      <div class="controls">
        <button id="copyMermaid" class="ghost" disabled>Copy Mermaid</button>
        <button id="exportSvg" class="ghost" disabled>Export SVG</button>
      </div>
    </div>
    <div class="out-scroll" id="viewport">
      <div class="canvas" id="canvas">
        <div class="placeholder">Diagram appears here after you generate it.</div>
      </div>
      <div class="zoom-controls" id="zoomControls" hidden>
        <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoomFit" title="Fit to screen" aria-label="Fit to screen">⤢</button>
      </div>
    </div>
    <div class="src-panel">
      <div class="src-head" id="srcHead">
        <span class="title">Mermaid source</span>
        <span class="title" id="srcToggle">show ▾</span>
      </div>
      <div class="src-body" id="srcBody"><pre id="mermaidSrc"></pre></div>
    </div>
  </section>
</main>

<div class="status" id="status">
  <span class="chip"><span class="dot" style="background:var(--accent)"></span> ready</span>
  <span>Parses standard <b>CREATE TABLE</b> + <b>ALTER TABLE … ADD FOREIGN KEY</b>. MySQL / PostgreSQL / generic dialects.</span>
</div>

<script>
/* ============================================================
   1. SQL DDL PARSER  —  raw SQL text  ->  intermediate model
   ============================================================ */

function stripComments(sql){
  return sql
    .replace(/\/\*[\s\S]*?\*\//g, ' ')   // block comments
    .replace(/--[^\n]*/g, ' ')           // -- line comments
    .replace(/(^|\s)#[^\n]*/g, ' ');     // # line comments (MySQL)
}

function cleanIdent(raw){
  if(!raw) return '';
  raw = raw.trim().replace(/[`"\[\]]/g,'');   // drop `` "" [] quoting
  const parts = raw.split('.');               // schema.table -> table
  return parts[parts.length-1];
}

// return {body, end} for the parenthesised block starting at/after `from`
function extractParen(str, from){
  const start = str.indexOf('(', from);
  if(start < 0) return null;
  let depth = 0;
  for(let i=start; i<str.length; i++){
    if(str[i]==='(') depth++;
    else if(str[i]===')'){ depth--; if(depth===0) return {body:str.slice(start+1,i), end:i}; }
  }
  return null;
}

// split a body on commas that sit at paren-depth 0
function splitTopLevel(body){
  const out=[]; let depth=0, cur='';
  for(const ch of body){
    if(ch==='(' ) { depth++; cur+=ch; }
    else if(ch===')') { depth--; cur+=ch; }
    else if(ch===',' && depth===0){ if(cur.trim()) out.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}

const CONSTRAINT_LEAD = /^(constraint\s+[`"\[]?\w+[`"\]]?\s+)?/i;
const KEY_IGNORE = /^(key|index|fulltext|spatial|check)\b/i;

function parseColumnDef(def){
  // name
  const nm = def.match(/^\s*([`"\[]?\w+[`"\]]?)\s+([\s\S]+)$/);
  if(!nm) return null;
  const name = cleanIdent(nm[1]);
  let rest = nm[2];

  // type token (word + optional (...) )
  const ty = rest.match(/^([A-Za-z_][\w]*(?:\s*\([^)]*\))?)\s*([\s\S]*)$/);
  const type = ty ? ty[1].replace(/\s+/g,'') : 'unknown';
  const mods = (ty ? ty[2] : rest);
  const U = mods.toUpperCase();

  const col = {
    name, type,
    is_pk:  /\bPRIMARY\s+KEY\b/.test(U),
    unique: /\bUNIQUE\b/.test(U),
    nullable: !/\bNOT\s+NULL\b/.test(U),
    ref: null,
  };
  // inline REFERENCES target(col)
  const r = mods.match(/references\s+([`"\[]?[\w.]+[`"\]]?)\s*(?:\(\s*([\w`"\[\]]+)\s*\))?/i);
  if(r) col.ref = { table: cleanIdent(r[1]), column: cleanIdent(r[2]||'') };
  return col;
}

function parseCreateTable(stmt){
  const head = stmt.match(/create\s+table\s+(?:if\s+not\s+exists\s+)?([`"\[]?[\w.]+[`"\]]?)/i);
  if(!head) return null;
  const name = cleanIdent(head[1]);
  const paren = extractParen(stmt, head.index + head[0].length);
  if(!paren) return { name, columns:[] };

  const table = { name, columns:[] };
  const byName = () => Object.fromEntries(table.columns.map(c=>[c.name.toLowerCase(), c]));

  for(let part of splitTopLevel(paren.body)){
    const stripped = part.replace(CONSTRAINT_LEAD, '');
    const U = stripped.toUpperCase();

    if(/^PRIMARY\s+KEY/.test(U)){
      const p = extractParen(stripped, 0);
      if(p){ const map=byName();
        splitTopLevel(p.body).forEach(c=>{ const col=map[cleanIdent(c).toLowerCase()]; if(col) col.is_pk=true; }); }
      continue;
    }
    if(/^FOREIGN\s+KEY/.test(U)){
      const local = extractParen(stripped, 0);
      const ref = stripped.match(/references\s+([`"\[]?[\w.]+[`"\]]?)\s*(?:\(\s*([\w`"\[\]]+)\s*\))?/i);
      if(local && ref){ const map=byName();
        const cols = splitTopLevel(local.body).map(cleanIdent);
        const c = map[cols[0].toLowerCase()];
        if(c) c.ref = { table:cleanIdent(ref[1]), column:cleanIdent(ref[2]||'') };
      }
      continue;
    }
    if(/^UNIQUE/.test(U)){
      const p = extractParen(stripped, 0);
      if(p){ const map=byName();
        splitTopLevel(p.body).forEach(c=>{ const col=map[cleanIdent(c).toLowerCase()]; if(col) col.unique=true; }); }
      continue;
    }
    if(KEY_IGNORE.test(stripped)) continue;   // secondary indexes etc.

    const col = parseColumnDef(part);
    if(col) table.columns.push(col);
  }
  return table;
}

function parseAlterFk(stmt){
  const t = stmt.match(/alter\s+table\s+([`"\[]?[\w.]+[`"\]]?)/i);
  if(!t) return null;
  const fk = stmt.match(/foreign\s+key\s*\(\s*([\w`"\[\]]+)\s*\)\s*references\s+([`"\[]?[\w.]+[`"\]]?)\s*(?:\(\s*([\w`"\[\]]+)\s*\))?/i);
  if(!fk) return null;
  return { table:cleanIdent(t[1]), column:cleanIdent(fk[1]), refTable:cleanIdent(fk[2]), refColumn:cleanIdent(fk[3]||'') };
}

function parseSQL(sql){
  const clean = stripComments(sql);
  const statements = clean.split(';').map(s=>s.trim()).filter(Boolean);
  const tables = [];
  const alters = [];
  for(const s of statements){
    if(/^create\s+table/i.test(s)){ const t = parseCreateTable(s); if(t) tables.push(t); }
    else if(/^alter\s+table/i.test(s)){ const a = parseAlterFk(s); if(a) alters.push(a); }
  }
  // fold ALTER-added FKs back onto their columns
  const idx = Object.fromEntries(tables.map(t=>[t.name.toLowerCase(), t]));
  for(const a of alters){
    const t = idx[a.table.toLowerCase()];
    if(!t) continue;
    const col = t.columns.find(c=>c.name.toLowerCase()===a.column.toLowerCase());
    if(col) col.ref = { table:a.refTable, column:a.refColumn };
  }
  return tables;
}

/* ============================================================
   2. RELATIONSHIP + CARDINALITY INFERENCE  (pure logic)
   ============================================================ */

function inferRelationships(tables){
  const rels = [];
  const known = new Set(tables.map(t=>t.name.toLowerCase()));
  const warnings = [];

  for(const t of tables){
    const fks = t.columns.filter(c=>c.ref);
    const pks = t.columns.filter(c=>c.is_pk);

    // junction table -> many-to-many
    const isJunction = fks.length===2 && pks.length===2 && pks.every(c=>c.ref);
    if(isJunction){
      rels.push({ from:fks[0].ref.table, to:fks[1].ref.table, card:'M:N', via:t.name, label:t.name });
      continue;
    }
    for(const c of fks){
      if(!known.has(c.ref.table.toLowerCase()))
        warnings.push(`"${t.name}.${c.name}" references undefined table "${c.ref.table}"`);
      const oneToOne = c.unique || (c.is_pk && pks.length===1);
      rels.push({ from:c.ref.table, to:t.name, card: oneToOne ? '1:1' : '1:N', label:c.name });
    }
  }
  return { rels, warnings };
}

/* ============================================================
   3. RENDER  ->  Mermaid erDiagram text
   ============================================================ */

const CARD = { '1:1':'||--||', '1:N':'||--o{', 'M:N':'}o--o{' };
const safe   = s => (s||'x').replace(/\W+/g,'_').replace(/^_+|_+$/g,'') || 'x';
const safeTy = s => (s||'type').replace(/[()\s,]+/g,'_').replace(/^_+|_+$/g,'') || 'type';

function toMermaid(tables, rels){
  const lines = ['erDiagram'];
  for(const r of rels){
    lines.push(`  ${safe(r.from)} ${CARD[r.card]} ${safe(r.to)} : ${safe(r.label)}`);
  }
  for(const t of tables){
    lines.push(`  ${safe(t.name)} {`);
    if(t.columns.length===0) lines.push('    string _ "empty"');
    for(const c of t.columns){
      const keys = [];
      if(c.is_pk) keys.push('PK');
      if(c.ref)   keys.push('FK');
      if(c.unique && !c.is_pk && !c.ref) keys.push('UK');
      lines.push(`    ${safeTy(c.type)} ${safe(c.name)}${keys.length?' '+keys.join(','):''}`);
    }
    lines.push('  }');
  }
  return lines.join('\n');
}

/* ============================================================
   4. THEME  (light / dark, incl. the diagram itself)
   ============================================================ */

const MERMAID_THEME = {
  light:{
    fontFamily:'IBM Plex Mono, monospace',
    primaryColor:'#ffffff', primaryBorderColor:'#4E43E0',
    lineColor:'#8A93A6', primaryTextColor:'#172231',
    attributeBackgroundColorOdd:'#ffffff', attributeBackgroundColorEven:'#F7F8FA',
  },
  dark:{
    fontFamily:'IBM Plex Mono, monospace',
    primaryColor:'#1B2531', primaryBorderColor:'#7B72FF',
    lineColor:'#6B7A8D', primaryTextColor:'#E4E9EF',
    attributeBackgroundColorOdd:'#161E27', attributeBackgroundColorEven:'#1B2531',
  },
};

function initMermaid(mode){
  mermaid.initialize({
    startOnLoad:false, securityLevel:'loose', theme:'base',
    themeVariables: MERMAID_THEME[mode],
    er:{ useMaxWidth:false, entityPadding:14 },
  });
}

function storedTheme(){
  try{ return localStorage.getItem('schema-er-theme'); }catch{ return null; }
}
function persistTheme(mode){
  try{ localStorage.setItem('schema-er-theme', mode); }catch{}
}

function applyTheme(mode, rerender=true){
  document.documentElement.setAttribute('data-theme', mode);
  $('themeToggle').setAttribute('aria-label', mode==='dark' ? 'Switch to light mode' : 'Switch to dark mode');
  initMermaid(mode);
  if(rerender && lastMermaid) generate();
}

/* ============================================================
   5. UI WIRING
   ============================================================ */

const $ = id => document.getElementById(id);
let renderCount = 0, lastSvg = '', lastMermaid = '';

/* ---- pan / zoom viewport ---- */
let viewSvg = null, natW = 0, natH = 0;
let scale = 1, tx = 0, ty = 0;
const MIN_SCALE = 0.1, MAX_SCALE = 8;
const clamp = (v,a,b)=>Math.max(a, Math.min(b, v));

function applyTransform(){
  if(!viewSvg) return;
  viewSvg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  $('zoomLabel').textContent = Math.round(scale*100) + '%';
}
// zoom toward point (cx,cy) — coords relative to the viewport
function zoomTo(newScale, cx, cy, base){
  newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
  tx = cx - (cx - base.tx) * (newScale / base.scale);
  ty = cy - (cy - base.ty) * (newScale / base.scale);
  scale = newScale;
  applyTransform();
}
function fitView(){
  if(!viewSvg) return;
  const vp = $('viewport').getBoundingClientRect();
  const pad = 48;
  const s = Math.min((vp.width - pad)/natW, (vp.height - pad)/natH, 1);
  scale = (s > 0 && isFinite(s)) ? s : 1;
  tx = (vp.width  - natW*scale)/2;
  ty = (vp.height - natH*scale)/2;
  applyTransform();
}
function setupView(el){
  viewSvg = el;
  const vb = el.viewBox && el.viewBox.baseVal;
  natW = (vb && vb.width)  ? vb.width  : el.getBoundingClientRect().width;
  natH = (vb && vb.height) ? vb.height : el.getBoundingClientRect().height;
  el.setAttribute('width',  natW);
  el.setAttribute('height', natH);
  el.style.maxWidth = 'none';
  $('zoomControls').hidden = false;
  fitView();
}
function hideZoom(){ viewSvg = null; $('zoomControls').hidden = true; }

async function generate(){
  const sql = $('sql').value;
  const tables = parseSQL(sql);
  const { rels, warnings } = inferRelationships(tables);

  if(tables.length===0){
    setStatus({ err:'No CREATE TABLE statements found. Check your SQL.' });
    $('canvas').innerHTML = '<div class="placeholder">Nothing to draw yet.</div>';
    $('copyMermaid').disabled = $('exportSvg').disabled = true;
    hideZoom();
    lastMermaid = '';
    return;
  }

  const code = toMermaid(tables, rels);
  lastMermaid = code;
  $('mermaidSrc').textContent = code;

  try{
    const { svg } = await mermaid.render('er_'+(++renderCount), code);
    $('canvas').innerHTML = svg;
    lastSvg = svg;
    setupView($('canvas').querySelector('svg'));
    $('copyMermaid').disabled = $('exportSvg').disabled = false;
    setStatus({ tables:tables.length, rels:rels.length, warnings });
  }catch(e){
    hideZoom();
    $('canvas').innerHTML = '<div class="placeholder">Render error — see Mermaid source below.</div>';
    setStatus({ err:'Mermaid could not render this schema. '+(e && e.message ? e.message : '') });
    $('srcBody').classList.add('open'); $('srcToggle').textContent='hide ▴';
  }
}

function setStatus({tables, rels, warnings=[], err}={}){
  const box = $('status');
  if(err){ box.innerHTML = `<span class="chip"><span class="dot" style="background:var(--err)"></span> error</span><span class="err">${err}</span>`; return; }
  let html = `<span class="chip"><span class="dot" style="background:var(--mn)"></span> done</span>`
    + `<span><b>${tables}</b> tables · <b>${rels}</b> relationships</span>`;
  if(warnings.length){
    html += `<span class="warn">${warnings.length} warning${warnings.length>1?'s':''}: ${warnings.slice(0,2).join('; ')}${warnings.length>2?' …':''}</span>`;
  }
  box.innerHTML = html;
}

/* ---- zoom controls + wheel + drag/pinch pan ---- */
const viewport = $('viewport');
const vpPoint = e => { const r = viewport.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };

// buttons zoom about the viewport centre
function buttonZoom(factor){
  if(!viewSvg) return;
  const r = viewport.getBoundingClientRect();
  zoomTo(scale*factor, r.width/2, r.height/2, {scale, tx, ty});
}
$('zoomIn').addEventListener('click', ()=>buttonZoom(1.25));
$('zoomOut').addEventListener('click', ()=>buttonZoom(1/1.25));
$('zoomFit').addEventListener('click', fitView);

// wheel zoom toward cursor
viewport.addEventListener('wheel', e=>{
  if(!viewSvg) return;
  e.preventDefault();
  const p = vpPoint(e);
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomTo(scale*factor, p.x, p.y, {scale, tx, ty});
}, {passive:false});

// pointer pan (1 finger / mouse) + pinch zoom (2 fingers)
const pointers = new Map();
let panStart = null, pinchStart = null;

viewport.addEventListener('pointerdown', e=>{
  if(!viewSvg || e.target.closest('.zoom-controls')) return;
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){ panStart = {x:e.clientX, y:e.clientY, tx, ty}; viewport.classList.add('grabbing'); }
  else if(pointers.size === 2){ pinchStart = pinchInfo(); panStart = null; }
});
viewport.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1 && panStart){
    tx = panStart.tx + (e.clientX - panStart.x);
    ty = panStart.ty + (e.clientY - panStart.y);
    applyTransform();
  } else if(pointers.size === 2 && pinchStart){
    const now = pinchInfo();
    const r = viewport.getBoundingClientRect();
    zoomTo(pinchStart.scale * (now.dist / pinchStart.dist), now.midX - r.left, now.midY - r.top, pinchStart);
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchStart = null;
  if(pointers.size === 0){ panStart = null; viewport.classList.remove('grabbing'); }
  else { const p = [...pointers.values()][0]; panStart = {x:p.x, y:p.y, tx, ty}; }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

function pinchInfo(){
  const [a, b] = [...pointers.values()];
  return {
    dist: Math.hypot(a.x-b.x, a.y-b.y),
    midX: (a.x+b.x)/2, midY: (a.y+b.y)/2,
    scale, tx, ty,
  };
}
// keep the diagram centred on window resize when it would otherwise drift off-screen
window.addEventListener('resize', ()=>{ if(viewSvg) applyTransform(); });
